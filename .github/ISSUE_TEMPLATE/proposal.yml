name: Project proposal
description: Suggest an improvement or offer to help with fabrication, testing, CAD or software.
title: "[Proposal] "
body:
  - type: markdown
    attributes:
      value: "Thanks for helping build KINETIQ. This is a public issue; do not include private contact details or credentials."
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - CAD and fabrication
        - Prototype testing
        - App and control programs
        - Build documentation
        - Parts and sourcing
        - Other
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What would you improve, or what skill or resource can you offer?
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Revision and evidence
      description: Relevant design revision, measurements, sketches or links. Separate tested results from ideas.
  - type: textarea
    id: next_steps
    attributes:
      label: Suggested next steps
      description: What would help evaluate or carry out the proposal?
